<nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-primary text-primary-foreground flex items-center justify-center font-bold text-lg">F</div>
        <span class="text-xl font-bold hidden sm:inline">FreelanceHub</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-6">
        <a *ngFor="let link of navLinks" [routerLink]="link.path" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors">
          {{ link.label }}
        </a>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-3">
        <ng-container *ngIf="isLoggedIn; else loggedOut">
          <button class="relative hidden sm:inline-flex" aria-label="Notifications">
            <!-- bell icon placeholder -->
            <span class="sr-only">Notifications</span>
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#333"/></svg>
            <span *ngIf="unreadMessages > 0" class="absolute -top-1 -right-1 w-5 h-5 flex items-center justify-center p-0 text-xs bg-red-600 text-white rounded-full">{{ unreadMessages }}</span>
          </button>

          <button class="relative hidden sm:inline-flex" routerLink="/messages" aria-label="Messages">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="12" stroke="#333"/></svg>
            <span *ngIf="unreadMessages > 0" class="absolute -top-1 -right-1 w-5 h-5 flex items-center justify-center p-0 text-xs bg-red-600 text-white rounded-full">{{ unreadMessages }}</span>
          </button>

          <!-- User avatar dropdown placeholder -->
          <div class="relative">
            <button class="rounded-full" aria-label="User menu">
              <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center">JD</div>
            </button>
            <!-- simple dropdown example -->
            <div class="absolute right-0 mt-2 w-56 bg-white border rounded shadow-md p-2" *ngIf="false">
              <!-- dropdown content would go here -->
            </div>
          </div>
        </ng-container>
        <ng-template #loggedOut>
          <button class="hidden sm:inline-flex">Sign In</button>
          <button>Get Started</button>
        </ng-template>

        <!-- Mobile Menu Toggle -->
        <button class="md:hidden" (click)="toggleMobile()" aria-label="Toggle menu">
          <svg *ngIf="!mobileMenuOpen" class="w-5 h-5" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="2"/><rect x="3" y="11" width="18" height="2"/><rect x="3" y="16" width="18" height="2"/></svg>
          <svg *ngIf="mobileMenuOpen" class="w-5 h-5" viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="20" stroke="#000"/><line x1="20" y1="4" x2="4" y2="20" stroke="#000"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden py-4 border-t">
      <div class="flex flex-col gap-3">
        <a *ngFor="let link of navLinks" [routerLink]="link.path" (click)="toggleMobile()" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors py-2">{{ link.label }}</a>
        <ng-container *ngIf="!isLoggedIn">
          <button class="w-full" routerLink="/login">Sign In</button>
          <button class="w-full" routerLink="/register">Get Started</button>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
